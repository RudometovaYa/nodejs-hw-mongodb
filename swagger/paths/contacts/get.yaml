tags:
  - Contacts
summary: Get all contacts with optional filters, pagination, and sorting
operationId: getContacts
description: Retrieve a list of contacts with optional filters, pagination, and sorting options
security:
  - bearerAuth: []

parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
    description: Page number for pagination

  - in: query
    name: perPage
    schema:
      type: integer
      default: 20
    description: Number of contacts per page

  - in: query
    name: sortBy
    schema:
      type: string
      enum: [name, createdAt, updatedAt]
    description: Field to sort by

  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: Sort order (ascending or descending)

  - in: query
    name: type
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by type

  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter contacts by favorite status

responses:
  '200':
    description: Successfully retrieved list of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 20
                totalItems:
                  type: integer
                  example: 100
                totalPages:
                  type: integer
                  example: 5
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true

  '401':
    description: Unauthorized - missing or invalid token
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unauthorized
